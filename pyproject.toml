[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotdesk"
version = "0.1.0"
description = "Lokale Desktop-Anwendung für Kunden, Rechnungen und Zahlungen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["billing", "invoicing", "desktop", "sqlite", "datev"]

[project.scripts]
hotdesk = "hotdesk:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "hotdesk"]

[tool.hatch.build.targets.sdist]
include = ["app", "hotdesk", "README.md", "packaging"]
